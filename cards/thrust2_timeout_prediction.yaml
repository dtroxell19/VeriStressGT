# UCLA TA1 -- Thrust 2 (diagnostic metric): predicting verifier timeouts from Difficulty Profiles.
#
# One timeout predictor per verifier (elastic-net logistic regression on network size/type +
# the five Difficulty-Profile components). Two evaluations:
#
#   1. Recorded (primary): trained and tested on the paper's server runs (345 instances: 225
#      synthetic constructor instances + 120 VNN-COMP mnist_fc / oval21 instances; abcrown,
#      neuralsat, marabou, nnenum, pyrat). Test sets are network-grouped held-out splits,
#      repeated over 10 seeds. Labels use the same horizon as the live runs (120 s).
#   2. Live out-of-distribution (reported): 30 fresh networks (new seeds, off-grid parameters)
#      are featurized on the fly and run through abcrown, pyrat, nnenum, neuralsat and marabou at a
#      120 s timeout; the predictors, fitted on all recorded data, rank which instances time out.
#      A few recorded anchor instances are re-run to measure how each verifier's speed differs from
#      the recording environment (reported as a diagnostic).
#
# Metrics: min_verifier_auc (worst verifier's held-out AUC, the claim's quantity), each verifier's
# held-out AUC, and min_ood_auc (worst live AUC on fresh networks), see `symbols`.
#
# Claim: every verifier's mean held-out AUC is >= target_auc. The plan does not align this metric
# to the BAA's 95% accuracy goal: timeouts depend on network size, verifier strengths and problem
# geometry, so the prediction problem is inherently noisy.

title: "VeriStressGT Thrust 2: Per-Verifier Timeout Prediction"
description: |
  Trains one timeout predictor per verifier on recorded verifier runs using network size/type
  and Difficulty-Profile features, and reports held-out AUC over repeated network-grouped
  splits. Also scores the predictors on live runs of all five verifiers (abcrown, pyrat, nnenum,
  neuralsat, marabou) over fresh, out-of-distribution networks whose features are computed on
  the fly.

version: 1.0

organizations:
  - UCLA

submitter:
  name: UCLA TA1 Team
  email: davidtroxell@g.ucla.edu

tags:
  - ucla
  - difficulty-profile
  - timeout-prediction
  - cross-verifier

links:
  - title: "VeriStressGT"
    url: "https://github.com/dtroxell19/VeriStressGT"
    type: "software"

symbols:
  target_auc:
    type: float
    value: 0.7

  min_verifier_auc:
    metadata:
      kind: metric
      display: true
      display_name: "Held-out timeout AUC, worst verifier (target >= 0.7)"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  abcrown_auc:
    metadata:
      kind: metric
      display: true
      display_name: "Held-out timeout AUC, alpha-beta-CROWN"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  neuralsat_auc:
    metadata:
      kind: metric
      display: true
      display_name: "Held-out timeout AUC, NeuralSAT"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  marabou_auc:
    metadata:
      kind: metric
      display: true
      display_name: "Held-out timeout AUC, Marabou"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  nnenum_auc:
    metadata:
      kind: metric
      display: true
      display_name: "Held-out timeout AUC, nnenum"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  pyrat_auc:
    metadata:
      kind: metric
      display: true
      display_name: "Held-out timeout AUC, PyRAT"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

  min_ood_auc:
    metadata:
      kind: metric
      display: true
      display_name: "Live timeout AUC on fresh networks, worst verifier"
      define_metric:
        objective: maximize
        aggregation_strategy:
          type: mean

claim:
  python: |
    low = {v: round(a, 3) for v, a in per_verifier_auc.items() if a is None or a < target_auc}
    assert not low, (
      f"held-out timeout AUC below {target_auc} for {low} "
      f"(all verifiers: { {v: round(a, 3) for v, a in per_verifier_auc.items()} })"
    )

pipeline:
  thrust2:
    # installed by `pip install -e .` (bootstrap.sh); runs aiq/ from any working directory
    executable: 'veristressgt-thrust2'
    algo_params:
      horizon: 120
      repeats: 10
      ood_bench_dir: 'thrust2_ood_bench'
      run_dir: 'thrust2_run'
      real_jobs: 2
      abcrown_config: 'src/VeriStressGT/configs/abcrown_basic.yaml'
    out_paths:
      results_fpath: 'results.json'

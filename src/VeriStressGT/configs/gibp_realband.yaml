    input_dim: 100
    num_classes: 10
    num_pairs: 128
    epsilon: 0.1
    gamma: 0.001
    weight_scale: 2.0
    label: 0
- id: milp_hi1
  construction: mlp_relu.milp.exact_radius
  seed: 0
  args:
    input_dim: 50
    h1: 20
    h2: 20
    num_outputs: 5
    epsilon_frac: 0.99
    rmax: 2.0
    time_limit: 240.0
    mip_gap: null
    epsilon_mode: safe
- id: milp_hi2

# gibp_realband: the four amplifier-type constructor families with their amplitude knob pushed
# toward the IBP relative gap (G_IBP) of real verified-robust networks. See
# src/VeriStressGT/benchmarks/gibp_realband/README.md.
name: gibp_realband
defaults:
  seed: 0
instances:
- id: meap_hi1
  construction: mlp_relu.meap
  seed: 0
  args:
    input_dim: 100
    num_classes: 10
    num_pairs: 32
    epsilon: 0.1
    gamma: 0.001
    weight_scale: 2.0
    label: 0
- id: meap_hi2
  construction: mlp_relu.meap
  seed: 0
  args:
    input_dim: 100
    num_classes: 10
    num_pairs: 64
    epsilon: 0.1
    gamma: 0.001
    weight_scale: 2.0
    label: 0
- id: meap_hi3
